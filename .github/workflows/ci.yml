name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore ECommerceStore.sln

      - name: Build solution
        run: dotnet build ECommerceStore.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test ECommerceStore.sln --configuration Release --no-build --logger "trx;LogFileName=test-results-${{ runner.os }}.trx"

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Validate migrations and model
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: Data Source=${{ runner.temp }}/ecommerce-model-check.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore ECommerceStore.sln

      - name: Build web project
        run: dotnet build src/ECommerceStore.Web/ECommerceStore.Web.csproj --configuration Release --no-restore

      - name: Apply migrations to a fresh temporary database
        run: >-
          dotnet ef database update
          --project src/ECommerceStore.Web/ECommerceStore.Web.csproj
          --startup-project src/ECommerceStore.Web/ECommerceStore.Web.csproj
          --configuration Release
          --no-build
          --connection "Data Source=${{ runner.temp }}/ecommerce-ci.db"

      - name: Confirm the temporary database was created
        shell: bash
        run: test -s "${RUNNER_TEMP}/ecommerce-ci.db"

      - name: Confirm the model has no pending migration changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/ECommerceStore.Web/ECommerceStore.Web.csproj
          --startup-project src/ECommerceStore.Web/ECommerceStore.Web.csproj
          --configuration Release
          --no-build

      - name: Remove temporary database files
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/ecommerce-ci.db" "${RUNNER_TEMP}/ecommerce-ci.db-shm" "${RUNNER_TEMP}/ecommerce-ci.db-wal" "${RUNNER_TEMP}/ecommerce-model-check.db" "${RUNNER_TEMP}/ecommerce-model-check.db-shm" "${RUNNER_TEMP}/ecommerce-model-check.db-wal"
